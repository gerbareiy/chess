name: Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: '${{ github.workspace }}/vcpkg'
          vcpkgGitCommitId: 86dc619bd8d9697405ae5c944b474117ea9457ce

      - name: Configure
        run: cmake -S . -B build -A x64 -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake

      - name: Build (Release)
        run: cmake --build build --config Release --parallel

      - name: Run tests (Release)
        working-directory: build
        run: ctest -C Release --output-on-failure

      - name: Build (Debug)
        run: cmake --build build --config Debug --parallel

      - name: Run tests (Debug)
        working-directory: build
        run: ctest -C Debug --output-on-failure

  build-linux:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build g++-14 pkg-config \
            xorg-dev libglu1-mesa-dev libxinerama-dev libxcursor-dev \
            libxkbcommon-dev libwayland-dev wayland-protocols

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-ubuntu-24.04-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-ubuntu-24.04-

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: '${{ github.workspace }}/vcpkg'
          vcpkgGitCommitId: 86dc619bd8d9697405ae5c944b474117ea9457ce

      # Ninja bakes the configuration into the build tree, so each one gets its own - the same layout build.py
      # produces locally.
      - name: Configure (Release)
        run: >
          cmake -S . -B build/Release -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=gcc-14
          -DCMAKE_CXX_COMPILER=g++-14
          -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake

      - name: Build (Release)
        run: cmake --build build/Release --parallel

      - name: Run tests (Release)
        run: ctest --test-dir build/Release --output-on-failure

      - name: Configure (Debug)
        run: >
          cmake -S . -B build/Debug -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=gcc-14
          -DCMAKE_CXX_COMPILER=g++-14
          -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake

      - name: Build (Debug)
        run: cmake --build build/Debug --parallel

      - name: Run tests (Debug)
        run: ctest --test-dir build/Debug --output-on-failure
