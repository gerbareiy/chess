syntax = "proto3";

package chess.proto;

import "Chessboard.proto";
import "Move.proto";
import "Session.proto";

message Envelope
{
    oneof payload
    {
        Move        move         = 1;
        Chessboard  board_sync   = 2; // принудительный ресинк (отклонение хода)
        FindGame    find_game    = 3;
        GameStarted game_started = 4;
        GameOver    game_over    = 5;
        Chessboard  board_check  = 6; // периодическая сверка доски (раз в ~10 полуходов)
    }
}
